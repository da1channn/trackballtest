name: Endgame 1.5.3 pull-up GPIO diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/endgame-diagnostic.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Get original Endgame 1.5.3 sources
        uses: actions/checkout@v4
        with:
          repository: efogtech/endgame-trackball-config
          ref: 099d79d8bd7800169dc5b1b86ee6f17aea4d2d75
          path: upstream
          persist-credentials: false

      - name: Fetch pinned firmware dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir firmware
          cp -R upstream/config firmware/config
          cd firmware
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Add pull-up comparison and diagnostic logging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('firmware')
          zmk_sha = subprocess.check_output(['git', '-C', str(root/'zmk'), 'rev-parse', 'HEAD'], text=True).strip()
          assert zmk_sha.startswith('50d57079'), zmk_sha
          p = root/'zmk/app/module/drivers/kscan/kscan_gpio_direct.c'
          src = p.read_text()
          old = 'LOG_DBG("Sending event at 0,%i state %s", gpio->index, pressed ? "on" : "off");'
          new = 'LOG_INF("EGDIAG1 button=%u pin=%u state=%s", (unsigned int)gpio->index, (unsigned int)gpio->spec.pin, pressed ? "DOWN" : "UP");'
          assert src.count(old) == 1, 'Unexpected driver; refusing to patch'
          src = src.replace(old, new)
          raw = "\n/* Read back diagnostics. Front GPIO 7 and 8 pull-ups are configured through devicetree; never drive outputs. */\n#include <hal/nrf_gpio.h>\nstatic uint32_t egdiag_last_in = UINT32_MAX;\nstatic uint32_t egdiag_last_c7 = UINT32_MAX;\nstatic uint32_t egdiag_last_c8 = UINT32_MAX;\nstatic unsigned int egdiag_ticks;\nstatic void egdiag_poll(struct k_work *work);\nK_WORK_DELAYABLE_DEFINE(egdiag_work, egdiag_poll);\nstatic void egdiag_poll(struct k_work *work) {\n    ARG_UNUSED(work);\n    uint32_t input = NRF_P0->IN & (BIT(7) | BIT(8));\n    uint32_t c7 = NRF_P0->PIN_CNF[7];\n    uint32_t c8 = NRF_P0->PIN_CNF[8];\n    if (input != egdiag_last_in || c7 != egdiag_last_c7 ||\n        c8 != egdiag_last_c8 || ++egdiag_ticks >= 20) {\n        LOG_INF(\"EGPULL3 R7=%u L8=%u cfg7=%08x cfg8=%08x PU7=%u PU8=%u\",\n                (unsigned int)((input >> 7) & 1),\n                (unsigned int)((input >> 8) & 1),\n                (unsigned int)c7, (unsigned int)c8,\n                (unsigned int)((c7 & 0x0f) == 0x0c),\n                (unsigned int)((c8 & 0x0f) == 0x0c));\n        egdiag_last_in = input;\n        egdiag_last_c7 = c7;\n        egdiag_last_c8 = c8;\n        egdiag_ticks = 0;\n    }\n    k_work_reschedule(&egdiag_work, K_MSEC(100));\n}\n"
          anchor = 'static int kscan_direct_init(const struct device *dev) {'
          assert src.count(anchor) == 1
          src = src.replace(anchor, raw + '\n' + anchor)
          anchor2 = '    data->dev = dev;'
          assert src.count(anchor2) == 1
          src = src.replace(anchor2, anchor2 + '\n    k_work_schedule(&egdiag_work, K_SECONDS(3));')
          p.write_text(src)
          bp = Path('upstream/boards/arm/efogtech_trackball_0/buttons.dtsi')
          bs = bp.read_text()
          assert '<5 0 &gpio0 7 0>' in bs and '<4 0 &gpio0 8 0>' in bs
          for pin in (4, 5):
              old_flags = f'<&btns {pin} (GPIO_ACTIVE_LOW)>'
              assert bs.count(old_flags) == 1
              bs = bs.replace(old_flags, f'<&btns {pin} (GPIO_ACTIVE_LOW | GPIO_PULL_UP)>')
          bp.write_text(bs)
          config = root/'config/efogtech_trackball_0.conf'
          config.write_text(config.read_text() + '\n# Diagnostic: preserve input mappings and timing.\nCONFIG_ZMK_LOG_LEVEL_INF=y\nCONFIG_SHELL_PROMPT_UART="endgame-diag3$ "\n')
          print('Patched event log before keymap callback; internal pull-ups enabled on GPIO 7 and 8 only; no output drive.')
          PY

      - name: Compile diagnostic firmware
        shell: bash
        run: |
          set -euo pipefail
          cd firmware
          west build -s zmk/app -d build -b efogtech_trackball_0 \
            -S 'studio-rpc-usb-uart zmk-usb-logging' -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/firmware/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/upstream" \
            -DCONFIG_ZMK_STUDIO=y

      - name: Verify output and collect firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, struct, subprocess
          build = Path('firmware/build/zephyr')
          cfg = (build/'.config').read_text()
          for line in ['CONFIG_ZMK_LOG_LEVEL=4', 'CONFIG_LOG_MAX_LEVEL=3', 'CONFIG_ZMK_USB_LOGGING=y', 'CONFIG_BUILD_OUTPUT_UF2=y', 'CONFIG_SHELL_PROMPT_UART="endgame-diag3$ "']:
              assert line in cfg.splitlines(), f'Missing configuration: {line}'
          data = (build/'zmk.uf2').read_bytes()
          assert data and len(data) % 512 == 0
          payloads = []
          addresses = []
          for i in range(len(data)//512):
              block = data[i*512:(i+1)*512]
              m0, m1, flags, addr, size, num, total, family = struct.unpack_from('<8I', block)
              assert (m0, m1) == (0x0A324655, 0x9E5D5157)
              assert struct.unpack_from('<I', block, 508)[0] == 0x0AB16F30
              assert size <= 476 and num == i and total == len(data)//512
              assert flags & 0x2000 and family == 0x621E937A, 'Expected nRF52833 UF2'
              payloads.append(block[32:32+size])
              addresses.append((addr, size))
          payload = b''.join(payloads)
          assert b'EGPULL3 R7=' in payload and b'PU7=%u PU8=%u' in payload, 'Pull-up diagnostic missing'
          assert min(a for a, n in addresses) == 0x1000
          assert all(0x1000 <= a and a+n <= 0x6c000 for a,n in addresses)
          assert b'EGDIAG1 button=' in payload, 'Diagnostic logging not present in UF2'
          assert b'endgame-diag3$ ' in payload, 'Diagnostic prompt not present in UF2'
          out = Path('output'); out.mkdir()
          dest = out/'Endgame_1.5.3_pullup_diagnostic_v3.uf2'
          dest.write_bytes(data)
          shutil.copy(build/'.config', out/'build.config')
          shutil.copy(build/'zephyr.dts', out/'zephyr.dts')
          report = {
              'base_config_commit': '099d79d8bd7800169dc5b1b86ee6f17aea4d2d75',
              'zmk_commit': subprocess.check_output(['git','-C','firmware/zmk','rev-parse','HEAD'], text=True).strip(),
              'sha256': hashlib.sha256(data).hexdigest(),
              'uf2_blocks': len(data)//512,
              'min_address': hex(min(a for a, n in addresses)),
              'max_end_address': hex(max(a+n for a, n in addresses)),
              'hardware_tested': False,
              'purpose': 'Log kscan button transitions before keymap callback; enable pull-ups on P0.07 and P0.08 for controlled comparison; log raw inputs and actual PIN_CNF; not a repair'
          }
          (out/'verification.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload diagnostic UF2 and verification
        uses: actions/upload-artifact@v4
        with:
          name: Endgame-1.5.3-pullup-diagnostic-v3
          path: output/
          if-no-files-found: error

      - name: Upload configuration if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-build-failure
          path: |
            firmware/build/zephyr/.config
            firmware/build/zephyr/zephyr.dts
            firmware/build/zephyr/zmk.uf2
          include-hidden-files: true
          if-no-files-found: ignore
